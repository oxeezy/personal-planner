<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Personal Planner</title>

    <link
        rel="stylesheet"
        href="/frontend/css/auth.css?v=1"
    >

</head>


<body>


<main class="auth-page">


    <section class="auth-card">


        <!-- =====================================================
             BRAND
        ====================================================== -->

        <div class="auth-brand">

            <div class="brand-icon">
                ✓
            </div>

            <h1>
                Personal Planner
            </h1>

            <p>
                Stay organized. Stay focused.
            </p>

        </div>



        <!-- =====================================================
             LOGIN
        ====================================================== -->

        <div class="auth-content">

            <h2>
                Welcome back
            </h2>

            <p class="auth-subtitle">
                Sign in to continue to your planner.
            </p>


            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- ERROR -->

                <p
                    id="loginError"
                    class="form-message error-message"
                ></p>



                <!-- BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="auth-button"
                >
                    Login
                </button>


            </form>



            <!-- REGISTER -->

            <p class="auth-switch">

                Don't have an account?

                <a href="/register.html">
                    Create an account
                </a>

            </p>

        </div>


    </section>


</main>


<script src="/frontend/js/login.js?v=1"></script>

</body>

</html>
