<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Personal Planner</title>

    <link
        rel="stylesheet"
        href="/frontend/css/auth.css?v=1"
    >

</head>


<body>


<main class="auth-page">


    <section class="auth-card">


        <!-- =====================================================
             BRAND
        ====================================================== -->

        <div class="auth-brand">

            <div class="brand-icon">
                ✓
            </div>

            <h1>
                Personal Planner
            </h1>

            <p>
                Create your account and get organized.
            </p>

        </div>



        <!-- =====================================================
             REGISTER
        ====================================================== -->

        <div class="auth-content">

            <h2>
                Create your account
            </h2>

            <p class="auth-subtitle">
                Start managing your tasks, schedules, and applications.
            </p>


            <form id="registerForm">


                <!-- NAME -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        required
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >

                </div>



                <!-- ERROR -->

                <p
                    id="registerError"
                    class="form-message error-message"
                ></p>



                <!-- SUCCESS -->

                <p
                    id="registerSuccess"
                    class="form-message success-message"
                ></p>



                <!-- BUTTON -->

                <button
                    type="submit"
                    id="registerButton"
                    class="auth-button"
                >
                    Create Account
                </button>


            </form>



            <!-- LOGIN -->

            <p class="auth-switch">

                Already have an account?

                <a href="/login.html">
                    Sign in
                </a>

            </p>

        </div>


    </section>


</main>


<script src="/frontend/js/register.js?v=1"></script>

</body>

</html>
